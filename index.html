<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ec4899" />
  <title>PWA インストール確認</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14151a;
      color: #f2f2f2;
      padding: 1.5rem;
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    }
    .card {
      max-width: 26rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }
    .card img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }
    h1 { margin: 0; font-size: 1.3rem; }
    p { margin: 0; line-height: 1.6; color: #c7c7d1; }
    .status {
      width: 100%;
      padding: 0.9rem 1rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #3a3a44;
      font-size: 0.95rem;
      white-space: pre-line;
    }
    .status--ok { border-color: #4ade80; color: #4ade80; }
    .status--pending { border-color: #f59e0b; color: #f59e0b; }
    .counter {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 1.1rem;
    }
    button {
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #ec4899;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #db2777; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #install-button[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <img src="icon-192.png" alt="アプリアイコン" />
    <h1>PWA インストール確認</h1>
    <p>このページをホーム画面に追加すると、アプリのように起動できます。</p>

    <div id="display-status" class="status">読み込み中…</div>

    <button id="install-button" type="button" hidden>ホーム画面に追加</button>

    <div class="counter">
      <button id="decrement" type="button">-</button>
      <span id="count">0</span>
      <button id="increment" type="button">+</button>
    </div>
    <p style="font-size: 0.8rem; color: #888;">
      カウンターの値は localStorage に保存され、オフラインでも動作します。
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
